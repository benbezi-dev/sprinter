<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Sprinter</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0c16">
<meta name="description" content="Sprinter — 100 m et 200 m, six etapes de la competition scolaire au niveau inter galactique.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sprinter">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #0b0c16;
    color: #eef0f8; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  /* encoche et barre de gestes : on garde le jeu dans la zone sure */
  body {
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #cv { display: block; width: 100%; height: 100%; touch-action: none; }
  #boot {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: #0b0c16; z-index: 10; transition: opacity .4s;
  }
  #boot h1 { font-size: 42px; letter-spacing: 6px; color: #f8cd4a; font-weight: 800; }
  #boot p { font-size: 14px; color: #8b90ad; }
  #boot.gone { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="boot"><h1>SPRINTER</h1><p>chargement…</p></div>
<script src="sprinter-core.js"></script>
<script src="sprinter-app.js"></script>
<script src="sprinter-ui.js"></script>
<script>
(function () {
  var b = document.getElementById('boot');
  setTimeout(function () { b.classList.add('gone'); }, 350);
  setTimeout(function () { if (b.parentNode) b.parentNode.removeChild(b); }, 1200);
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
